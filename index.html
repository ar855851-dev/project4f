<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lucky Person of the Day</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="card">
    <div class="sparkle" aria-hidden="true">✦</div>
    <p class="eyebrow">A little reminder for today</p>
    <h1>You are the <span>lucky person</span> of the day!</h1>
    <p class="message">Good things are coming your way. Keep smiling, believe in yourself, and make today amazing.</p>
    <button id="luckyButton" type="button">Reveal my good luck ✨</button>
    <p id="luckyMessage" class="lucky-message" aria-live="polite"></p>
    <p class="date" id="todayDate"></p>
  </main>
  <script src="script.js"></script>
</body>
</html>
